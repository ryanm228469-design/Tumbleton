name: Publish to itch.io

on:
  push:
    branches: [main]
    paths: ['index.html']
  workflow_dispatch:

jobs:
  itch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package the game
        run: mkdir -p build && cp index.html build/

      - name: Push to sikmane.itch.io/tumbleton
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "No BUTLER_API_KEY secret yet, so skipping the itch.io upload."
            exit 0
          fi
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V
          ./butler push build sikmane/tumbleton:html5 --userversion "$(date -u +%Y.%m.%d-%H%M)"
